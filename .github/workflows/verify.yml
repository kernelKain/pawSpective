name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify FFmpeg runtime
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Test backend
        run: python -m pytest

      - name: Build backend container image
        run: >-
          docker build
          --file Dockerfile.backend
          --tag pawspective-backend:test
          .

      - name: Build frontend container image
        run: >-
          docker build
          --file frontend/Dockerfile
          --tag pawspective-frontend:test
          frontend

  containers:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI environment
        run: |
          cp .env.example .env
          {
            echo "PAWSPECTIVE_DEMO_MODE=true"
            echo "PAWSPECTIVE_CORS_ORIGINS=http://localhost:3000"
          } >> .env

      - name: Build production containers
        run: docker compose build

      - name: Start production containers
        run: docker compose up --detach

      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8000/api/v1/health/ready
            then
              exit 0
            fi

            echo "Backend is not ready yet (attempt ${attempt}/30)."
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Verify frontend
        run: curl --fail http://localhost:3000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes