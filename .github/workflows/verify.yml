name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate documentation links
        run: python scripts/check_markdown_links.py

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify FFmpeg runtime
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Test backend
        run: python -m pytest backend/tests

      - name: Build backend container image
        run: >-
          docker build
          --file Dockerfile.backend
          --tag pawspective-backend:test
          .

      - name: Build frontend container image
        run: >-
          docker build
          --file frontend/Dockerfile
          --tag pawspective-frontend:test
          frontend

  containers:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser-test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create CI environment
        run: |
          cp .env.example .env
          {
            echo "PAWSPECTIVE_DEMO_MODE=true"
            echo "PAWSPECTIVE_CORS_ORIGINS=http://localhost:3000"
          } >> .env

      - name: Build production containers
        run: docker compose -f compose.yaml -f compose.e2e.yaml build

      - name: Start production containers
        run: docker compose -f compose.yaml -f compose.e2e.yaml up --detach

      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8000/api/v1/health/ready
            then
              exit 0
            fi

            echo "Backend is not ready yet (attempt ${attempt}/30)."
            sleep 2
          done

          docker compose -f compose.yaml -f compose.e2e.yaml logs
          exit 1

      - name: Verify frontend root
        run: curl --fail http://localhost:3000

      - name: Verify production browser scaffold
        working-directory: frontend
        run: npm run test:e2e

      - name: Prove browser failure artifacts are retained
        id: artifact-smoke
        continue-on-error: true
        working-directory: frontend
        env:
          PAWSPECTIVE_E2E_ARTIFACT_SMOKE: "1"
        run: npm run test:e2e:artifact-smoke

      - name: Verify deliberate failure produced a screenshot
        env:
          ARTIFACT_SMOKE_OUTCOME: ${{ steps.artifact-smoke.outcome }}
        run: |
          test "$ARTIFACT_SMOKE_OUTCOME" = "failure"
          find frontend/test-results -name '*.png' -print -quit | grep .

      - name: Capture container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color > artifacts/compose.log 2>&1

      - name: Upload browser and container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          if-no-files-found: warn
          path: |
            artifacts/compose.log
            frontend/playwright-report/
            frontend/test-results/

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs

      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down --volumes
